<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Midnight Manhattan — Voxel City</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#02030a;overflow:hidden;font-family:ui-monospace,monospace;color:#cfd6e6}
  canvas{display:block}
  #hud{position:fixed;left:16px;bottom:16px;font-size:12px;letter-spacing:.18em;opacity:.75;text-transform:uppercase;pointer-events:none}
  #hud b{color:#ffb84a}
  #help{position:fixed;right:16px;bottom:16px;font-size:11px;opacity:.6;pointer-events:none;text-align:right}
</style>
</head>
<body>
<div id="hud">Midnight Manhattan · voxel night <b>● live</b></div>
<div id="help">Drag=orbit · RMB/Shift=pan · wheel=zoom · 1/2/3 keys</div>
<div id="camctl">
  <button onclick="setCamPreset('street')">Street</button>
  <button onclick="setCamPreset('bird')">Bird</button>
  <button onclick="setCamPreset('aerial')">Aerial</button>
  <button onclick="setCamPreset('auto')">Auto rotate</button>
  <button onclick="setCamPreset('reset')">Reset</button>
</div>
<style>
#camctl{position:fixed;right:16px;top:16px;display:flex;gap:6px;z-index:5;}
#camctl button{background:rgba(10,16,26,.72);color:#cfd6e6;border:1px solid #3a4150;padding:6px 9px;font-size:11px;letter-spacing:.1em;cursor:pointer;font-family:ui-monospace,monospace;}
#camctl button:hover{background:rgba(40,54,80,.85);}
</style>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040a);
scene.fog = new THREE.FogExp2(0x060a16, 0.010);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.prepend(renderer.domElement);

scene.add(new THREE.AmbientLight(0x1a2544, 0.3));
const moonL = new THREE.DirectionalLight(0x9bb7ff, 0.6);
moonL.position.set(-40,90,-60); scene.add(moonL);
scene.add(new THREE.HemisphereLight(0x2a3a6a, 0x05060a, 0.2));
// sky dome
const skyDome=new THREE.Mesh(new THREE.SphereGeometry(520,32,16), new THREE.MeshBasicMaterial({color:0x060b1a,side:THREE.BackSide,transparent:true,opacity:0.92}));
scene.add(skyDome);
const horizonBand=new THREE.Mesh(new THREE.CylinderGeometry(520,520,40,48,1,true), new THREE.MeshBasicMaterial({color:0x13203a,side:THREE.BackSide,transparent:true,opacity:0.35}));
horizonBand.position.y=18; scene.add(horizonBand);
// moon glow
const moonHalo=new THREE.Mesh(new THREE.PlaneGeometry(90,90), new THREE.MeshBasicMaterial({color:0x9bb7ff,transparent:true,opacity:0.05,blending:THREE.AdditiveBlending,depthWrite:false}));
moonHalo.position.set(-110,120,-150); moonHalo.lookAt(0,120,0); scene.add(moonHalo);


const asphaltCanvas=document.createElement('canvas'); asphaltCanvas.width=512; asphaltCanvas.height=512;
const actx=asphaltCanvas.getContext('2d');
actx.fillStyle='#0a0c12'; actx.fillRect(0,0,512,512);
for(let i=0;i<18000;i++){actx.fillStyle=`rgba(${30+Math.random()*40},${30+Math.random()*40},${36+Math.random()*44},${0.35+Math.random()*0.45})`; actx.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*2,1+Math.random()*2);}
for(let i=0;i<24;i++){actx.strokeStyle=`rgba(20,20,28,${0.25+Math.random()*0.35})`; actx.lineWidth=8+Math.random()*20; actx.beginPath(); actx.moveTo(Math.random()*512,Math.random()*512); actx.lineTo(Math.random()*512,Math.random()*512); actx.stroke();}
const asphaltTex=new THREE.CanvasTexture(asphaltCanvas);
const asphaltMat = new THREE.MeshStandardMaterial({map:asphaltTex,color:0xffffff,roughness:0.86,metalness:0.08});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600,600),asphaltMat);
ground.rotation.x=-Math.PI/2; scene.add(ground);

const curbMat = new THREE.MeshBasicMaterial({color:0x2a3140});
for(let i=-280;i<=280;i+=20){
  const h=new THREE.Mesh(new THREE.BoxGeometry(600,0.3,0.5),curbMat); h.position.set(0,0.15,i); scene.add(h);
  const v=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.3,600),curbMat); v.position.set(i,0.15,0); scene.add(v);
}

const sidewalkMat=new THREE.MeshStandardMaterial({color:0x2f333b,roughness:0.96});
const curbStripMat=new THREE.MeshStandardMaterial({color:0x7b808a,roughness:0.85});
for(let i=-9;i<=9;i++){
  const z=i*22;
  for(const side of [-1,1]){
    const sw=new THREE.Mesh(new THREE.BoxGeometry(600,0.2,2.4),sidewalkMat); sw.position.set(0,0.1,z+side*11.2); scene.add(sw);
    const cb=new THREE.Mesh(new THREE.BoxGeometry(600,0.32,0.3),curbStripMat); cb.position.set(0,0.16,z+side*9.9); scene.add(cb);
  }
  const x=i*22;
  for(const side of [-1,1]){
    const sw=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.2,600),sidewalkMat); sw.position.set(x+side*11.2,0.1,z); scene.add(sw);
    const cb=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.32,600),curbStripMat); cb.position.set(x+side*9.9,0.16,z); scene.add(cb);
  }
}
// oil stains / wear
for(let i=0;i<40;i++){
  const stain=new THREE.Mesh(new THREE.PlaneGeometry(6+Math.random()*10,6+Math.random()*10), new THREE.MeshBasicMaterial({color:0x02040a,transparent:true,opacity:0.18+Math.random()*0.18}));
  stain.rotation.x=-Math.PI/2; stain.position.set(Math.random()*400-200,0.03,Math.random()*400-200); scene.add(stain);
}
// puddles
for(let i=0;i<26;i++){
  const puddle=new THREE.Mesh(new THREE.PlaneGeometry(4+Math.random()*8,3+Math.random()*6), new THREE.MeshBasicMaterial({color:0x1a2a3a,transparent:true,opacity:0.22}));
  puddle.rotation.x=-Math.PI/2; puddle.position.set(Math.random()*360-180,0.04,Math.random()*360-180); scene.add(puddle);
}

const buildingColors = [0x1a1f2c,0x141824,0x1f2433,0x171c28,0x222838,0x12161f,0x1c2030];
const windowColors = [0xffe2a6,0xffd07a,0xffffff,0xaecbff,0xffb06a,0x88aaff,0xff9966];
const windowMats = windowColors.map((c,i)=>{const m=new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.5,roughness:0.2,metalness:0.1}); m.userData.phase=Math.random()*6.28; m.userData.speed=0.6+Math.random()*0.9; return m;});

const winGeo = new THREE.BoxGeometry(0.6,0.75,0.06);
const winByMat = new Map();
function regWindow(mat, m4){ if(!winByMat.has(mat)) winByMat.set(mat,[]); winByMat.get(mat).push(m4); }
const tmpM = new THREE.Matrix4(), tmpQ=new THREE.Quaternion(), tmpV=new THREE.Vector3(), WIN_BATCH=4000;

function addBuilding(cx,cz,w,d){
  w=Math.max(6,Math.round(w)); d=Math.max(6,Math.round(d));
  // voxel-ish height: integer
  let h = 6 + Math.floor(Math.random()*26);
  if(Math.abs(cx)<24 && Math.abs(cz)<24) h += Math.floor(Math.random()*18);
  const col = buildingColors[Math.floor(Math.random()*buildingColors.length)];
  // setbacks for tall
  const segs = h>22 ? [Math.floor(h*0.55), Math.floor(h*0.3), h-Math.floor(h*0.85)] : [h];
  let y=0; let curW=w, curD=d;
  segs.forEach((sh,i)=>{
    const shrink = i===1?2:(i===2?4:0);
    const bw=Math.max(4,curW-shrink), bd=Math.max(4,curD-shrink);
    const mat = new THREE.MeshStandardMaterial({color:col,roughness:0.88,metalness:0.12});
    const m = new THREE.Mesh(new THREE.BoxGeometry(bw,sh,bd),mat);
    m.position.set(cx,y+sh/2,cz); scene.add(m);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(bw+0.3,0.5,bd+0.3), new THREE.MeshStandardMaterial({color:0x0d1016,roughness:0.9}));
    roof.position.set(cx,y+sh+0.25,cz); scene.add(roof);
    // windows on vertical faces for this segment
    const xStep=1.5, yStep=1.7;
    const halfH=[bw/2,bd/2];
    const faces=[
      {axis:'x',sign:1,span:bd, bw:bw},
      {axis:'x',sign:-1,span:bd, bw:bw},
      {axis:'z',sign:1,span:bw, bw:bd},
      {axis:'z',sign:-1,span:bw, bw:bd},
    ];
    faces.forEach(f=>{
      const n=Math.floor(f.span/xStep);
      for(let yi=1; yi*yStep < sh-0.8; yi++){
        for(let xi=0; xi<n; xi++){
          if(Math.random()<0.4) continue;
          const along=(xi-(n-1)/2)*xStep;
          const yy=y+yi*yStep;
          const matW=windowMats[Math.floor(Math.random()*windowMats.length)];
          const spanDepth=(f.axis==='x'?bw:bd)/2;
          let px=cx,pz=cz;
          const norm=spanDepth+0.05;
          if(f.axis==='x'){px=cx+f.sign*norm; pz=cz+along;}
          else {pz=cz+f.sign*norm; px=cx+along;}
          tmpQ.setFromAxisAngle(new THREE.Vector3(0,1,0), f.axis==='x'?(f.sign>0?0:Math.PI):(f.sign>0?-Math.PI/2:Math.PI/2));
          tmpM.makeRotationFromQuaternion(tmpQ);
          tmpV.set(px,yy,pz); tmpM.setPosition(tmpV);
          regWindow(matW,tmpM.clone());
        }
      }
    });
    y+=sh; curW=bw; curD=bd;
  });
  // rooftop machinery + ledges
  if(Math.random()<0.72){
    const tank=new THREE.Mesh(new THREE.CylinderGeometry(0.9+Math.random()*0.8,1.0+Math.random()*0.8,1.8+Math.random()*0.8,9), new THREE.MeshStandardMaterial({color:[0x7a5a3a,0x5a606a,0x4a505a,0x8a6a4a][Math.floor(Math.random()*4)],roughness:0.85}));
    tank.position.set(cx+(Math.random()-0.5)*(w-3), h+1.0, cz+(Math.random()-0.5)*(d-3)); scene.add(tank);
  }
  if(h>16){
    for(let ly=12; ly<h-3; ly+=7+Math.floor(Math.random()*4)){
      const shrink = ly>h*0.62?4:0;
      const lw=Math.max(4,w-shrink), ld=Math.max(4,d-shrink);
      const ledge=new THREE.Mesh(new THREE.BoxGeometry(lw+0.9,0.32,ld+0.9), new THREE.MeshStandardMaterial({color:0x12151d,roughness:0.92}));
      ledge.position.set(cx,ly,cz); scene.add(ledge);
    }
  }
  if(Math.random()<0.5){
    const ac=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.9,1.0), new THREE.MeshStandardMaterial({color:0xb0b6bf,roughness:0.7,metalness:0.2}));
    ac.position.set(cx+w/2+0.6, 5+Math.random()*(h-8), cz+(Math.random()-0.5)*d*0.6); scene.add(ac);
  }
}
const block=22;
for(let gx=-9;gx<=9;gx++){
  for(let gz=-9;gz<=9;gz++){
    if(gx===0 && Math.abs(gz)<3) continue;
    if(gz===0 && Math.abs(gx)<3) continue;
    const cx=gx*block+(Math.random()-0.5)*2;
    const cz=gz*block+(Math.random()-0.5)*2;
    const w=7+Math.random()*10;
    const d=7+Math.random()*10;
    addBuilding(cx,cz,w,d);
  }
}

function tower(cx,cz,segments){
  let y=0;
  segments.forEach(seg=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(seg.w,seg.h,seg.w), new THREE.MeshStandardMaterial({color:0x1b2030,roughness:0.75,metalness:0.2}));
    m.position.set(cx,y+seg.h/2,cz); scene.add(m);
    const roof=new THREE.Mesh(new THREE.BoxGeometry(seg.w+0.4,0.5,seg.w+0.4), new THREE.MeshStandardMaterial({color:0x0d1016,roughness:0.9}));
    roof.position.set(cx,y+seg.h+0.25,cz); scene.add(roof);
    y+=seg.h;
  });
  const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,16,6), new THREE.MeshBasicMaterial({color:0xffffff}));
  ant.position.set(cx,y+8,cz); scene.add(ant);
  const beacon=new THREE.PointLight(0xff4444,3,50); beacon.position.set(cx,y+16,cz); scene.add(beacon);
}
tower(10,-8,[{w:16,h:28},{w:12,h:20},{w:8,h:15},{w:4,h:12}]);

const ch=[[18,14],[14,12],[10,10],[6,8],[4,6]];
let cy=0;
ch.forEach(s=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(s[0],s[1],s[0]), new THREE.MeshStandardMaterial({color:0x1c2336,roughness:0.7,metalness:0.25}));
  m.position.set(-24,cy+s[1]/2,14); scene.add(m); cy+=s[1];
});
const spire=new THREE.Mesh(new THREE.ConeGeometry(2,16,8), new THREE.MeshBasicMaterial({color:0xcfd6e6}));
spire.position.set(-24,cy+8,14); scene.add(spire);

// windows instanced
winByMat.forEach((arr,mat)=>{
  for(let i=0;i<arr.length;i+=WIN_BATCH){
    const chunk=arr.slice(i,i+WIN_BATCH);
    const im=new THREE.InstancedMesh(winGeo,mat,chunk.length);
    chunk.forEach((m4,idx)=>im.setMatrixAt(idx,m4));
    im.instanceMatrix.needsUpdate=true; scene.add(im);
  }
});

// Streetlights (pooled fewer)
const poleMat=new THREE.MeshStandardMaterial({color:0x3a404f,metalness:0.6,roughness:0.4});
const lampMat=new THREE.MeshStandardMaterial({color:0xffe2a6,emissive:0xffe2a6,emissiveIntensity:2.2});
const lampPositions=[];
for(let gx=-9;gx<=9;gx++){
  for(let gz=-9;gz<=9;gz++){
    if(Math.random()<0.72) continue;
    const x=gx*22+(Math.random()-0.5)*6;
    const z=gz*22+(Math.random()-0.5)*6;
    lampPositions.push({x,z});
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.22,10,6),poleMat);
    pole.position.set(x,5,z); scene.add(pole);
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.5,8,8),lampMat);
    lamp.position.set(x,10.6,z); scene.add(lamp);
  }
}
// point lights only for a subset to save perf
lampPositions.forEach((p,i)=>{
  if(i%3!==0) return;
  const pl=new THREE.PointLight(0xffd07a,1.1,32,2); pl.position.set(p.x,10.6,p.z); scene.add(pl);
});

// Neon signs on buildings
function makeSign(text,color){
  const c=document.createElement('canvas'); c.width=256; c.height=64;
  const ctx=c.getContext('2d');
  ctx.fillStyle='rgba(4,6,14,0.85)'; ctx.fillRect(0,0,256,64);
  ctx.font='bold 34px ui-monospace, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor=color; ctx.shadowBlur=18; ctx.fillStyle=color; ctx.fillText(text,128,32);
  const tex=new THREE.CanvasTexture(c); tex.needsUpdate=true;
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,blending:THREE.AdditiveBlending});
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(9,2.2),mat);
  return mesh;
}
const signs=[['BAR',0xff3366],['HOTEL',0x44ccff],['PIZZA',0xffaa33],['OPEN 24H',0x66ff99],['CAB',0xffff66],['Bodega',0xff66ff]];
signs.forEach(([t,col])=>{
  const s=makeSign(t,`#${col.toString(16).padStart(6,'0')}`);
  // place randomly near grid
  const bx=(Math.floor(Math.random()*7)-3)*22;
  const bz=(Math.floor(Math.random()*7)-3)*22;
  const y=4+Math.random()*18;
  s.position.set(bx+11, y, bz);
  s.rotation.y=Math.random()<0.5?Math.PI/2:-Math.PI/2;
  scene.add(s);
});

// Cars
const carGeo=new THREE.BoxGeometry(2,0.9,4.2);
const carColors=[0xee3333,0x111111,0xf5f5f5,0xffb000,0x2a4fa3,0x666666,0x33cc66];
const carGroups=carColors.map(c=>({mat:new THREE.MeshStandardMaterial({color:c,roughness:0.4,metalness:0.5}),mesh:null,idxs:[]}));
carGroups.forEach(g=>{g.mesh=new THREE.InstancedMesh(carGeo,g.mat,0); scene.add(g.mesh);});

// car trails
const trailGeo=new THREE.BoxGeometry(0.25,0.08,1.6);
const trailMat=new THREE.MeshBasicMaterial({color:0xffee99,transparent:true,opacity:0.55,blending:THREE.AdditiveBlending});
const trailMesh=new THREE.InstancedMesh(trailGeo,trailMat,0);
scene.add(trailMesh);


const paths=[];
for(let i=-7;i<=7;i++){paths.push({type:'h',z:i*22}); paths.push({type:'v',x:i*22});}
const cars=[];
for(let i=0;i<160;i++){
  const p=paths[Math.floor(Math.random()*paths.length)];
  const lane=(Math.random()<0.5?-3:3);
  const g=carGroups[Math.floor(Math.random()*carGroups.length)];
  const car={group:g,path:p,t:(Math.random()-0.5)*320,speed:9+Math.random()*18,lane:lane};
  car.instanceIdx=g.idxs.length; g.idxs.push(car); cars.push(car);
  car.trailIdx=i;
}
carGroups.forEach(g=>{g.mesh.count=g.idxs.length;});
trailMesh.count=cars.length;

// head/tail lights for cars
const headGeo=new THREE.BoxGeometry(0.35,0.25,0.15);
const headMat=new THREE.MeshBasicMaterial({color:0xffffdd,blending:THREE.AdditiveBlending});
const tailLightGeo=new THREE.BoxGeometry(0.35,0.22,0.12);
const tailLightMat=new THREE.MeshBasicMaterial({color:0xff2222,blending:THREE.AdditiveBlending});
const headMesh=new THREE.InstancedMesh(headGeo,headMat,cars.length*2);
const tailMesh=new THREE.InstancedMesh(tailLightGeo,tailLightMat,cars.length*2);
headMesh.count=cars.length*2; tailMesh.count=cars.length*2;
scene.add(headMesh); scene.add(tailMesh);

const tmpM2=new THREE.Matrix4(), tmpT=new THREE.Matrix4();
function updateCars(dt){
  cars.forEach((c,i)=>{
    c.t += c.speed*dt;
    if(c.t>170) c.t=-170;
    let x,z,rot;
    if(c.path.type==='h'){x=c.t;z=c.path.z+c.lane;rot=0;}
    else {z=c.t;x=c.path.x+c.lane;rot=Math.PI/2;}
    tmpM2.makeRotationY(rot); tmpM2.setPosition(x,0.45,z);
    c.group.mesh.setMatrixAt(c.instanceIdx,tmpM2);
    // trail
    const tx=x-Math.sin(rot)*2.6, tz=z-Math.cos(rot)*2.6;
    tmpT.makeRotationY(rot); tmpT.setPosition(tx,0.35,tz);
    trailMesh.setMatrixAt(i,tmpT);
    // headlights/tails
    const hx1=x+Math.sin(rot)*2.0+Math.cos(rot)*0.65, hz1=z+Math.cos(rot)*2.0-Math.sin(rot)*0.65;
    const hx2=x+Math.sin(rot)*2.0-Math.cos(rot)*0.65, hz2=z+Math.cos(rot)*2.0+Math.sin(rot)*0.65;
    const matH=new THREE.Matrix4().makeRotationY(rot); matH.setPosition(hx1,0.55,hz1); headMesh.setMatrixAt(i*2,matH);
    const matH2=new THREE.Matrix4().makeRotationY(rot); matH2.setPosition(hx2,0.55,hz2); headMesh.setMatrixAt(i*2+1,matH2);
    const txr=x-Math.sin(rot)*2.0+Math.cos(rot)*0.65, tzr=z-Math.cos(rot)*2.0-Math.sin(rot)*0.65;
    const txr2=x-Math.sin(rot)*2.0-Math.cos(rot)*0.65, tzr2=z-Math.cos(rot)*2.0+Math.sin(rot)*0.65;
    const matT=new THREE.Matrix4().makeRotationY(rot); matT.setPosition(txr,0.55,tzr); tailMesh.setMatrixAt(i*2,matT);
    const matT2=new THREE.Matrix4().makeRotationY(rot); matT2.setPosition(txr2,0.55,tzr2); tailMesh.setMatrixAt(i*2+1,matT2);
  });
  carGroups.forEach(g=>{if(g.idxs.length) g.mesh.instanceMatrix.needsUpdate=true;});
  trailMesh.instanceMatrix.needsUpdate=true;
  headMesh.instanceMatrix.needsUpdate=true;
  tailMesh.instanceMatrix.needsUpdate=true;
}


// animated billboards
function makeBillboard(idx){
  const c=document.createElement('canvas'); c.width=512; c.height=256;
  const ctx=c.getContext('2d');
  const colors=['#ff3366','#44ccff','#ffaa33','#66ff99','#ffff66','#ff66ff'];
  ctx.fillStyle='#050810'; ctx.fillRect(0,0,512,256);
  ctx.font='bold 48px ui-monospace, monospace'; ctx.textAlign='center'; ctx.fillStyle=colors[idx%colors.length];
  ctx.shadowColor=colors[idx%colors.length]; ctx.shadowBlur=22;
  const msgs=['MIDTOWN LIVE','OPEN 24/7','PIXEL CITY','NO SLEEP NYC','HELLO WORLD','BEAM'];
  ctx.fillText(msgs[idx%msgs.length],256,135);
  ctx.strokeStyle=colors[idx%colors.length]; ctx.lineWidth=6; ctx.strokeRect(14,14,484,228);
  const tex=new THREE.CanvasTexture(c);
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true});
  const m=new THREE.Mesh(new THREE.PlaneGeometry(18,9),mat);
  // animate flicker by storing
  m.userData.tex=tex; m.userData.phase=Math.random()*6.28;
  return m;
}
for(let i=0;i<7;i++){
  const b=makeBillboard(i);
  const x=(Math.floor(Math.random()*13)-6)*22 + (Math.random()-0.5)*4;
  const z=(Math.floor(Math.random()*13)-6)*22 + (Math.random()-0.5)*4;
  b.position.set(x, 24+Math.random()*16, z);
  b.rotation.y=Math.random()*Math.PI*2;
  scene.add(b);
}

// Stars
const starGeo=new THREE.BufferGeometry();
const starPos=new Float32Array(1800*3);
for(let i=0;i<1800;i++){starPos[i*3]=(Math.random()-0.5)*800; starPos[i*3+1]=60+Math.random()*260; starPos[i*3+2]=(Math.random()-0.5)*800;}
starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:0.6,transparent:true,opacity:0.85,sizeAttenuation:true})));

const moonMesh=new THREE.Mesh(new THREE.SphereGeometry(7,24,24), new THREE.MeshBasicMaterial({color:0xeef2ff}));
moonMesh.position.set(-110,120,-150); scene.add(moonMesh);
const moonGlow=new THREE.Mesh(new THREE.SphereGeometry(12,24,24), new THREE.MeshBasicMaterial({color:0x9bb7ff,transparent:true,opacity:0.06}));
moonGlow.position.copy(moonMesh.position); scene.add(moonGlow);

const rainGeo=new THREE.BufferGeometry();
const rainPos=new Float32Array(1200*3);
for(let i=0;i<1200;i++){rainPos[i*3]=(Math.random()-0.5)*260; rainPos[i*3+1]=Math.random()*100; rainPos[i*3+2]=(Math.random()-0.5)*260;}
rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xaabbdd,size:0.12,transparent:true,opacity:0.32}));
scene.add(rain);

// pedestrians
const pedGeo=new THREE.CapsuleGeometry(0.22,1.2,4,8);
const pedMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.8});
const pedColors=[0x334455,0x886633,0x223344,0x665544,0x445566,0x775533,0x3a3a3a];
const pedMesh=new THREE.InstancedMesh(pedGeo,pedMat,120);
const pedTmp=new THREE.Matrix4();
for(let i=0;i<120;i++){
  const x=Math.random()*360-180;
  const z=Math.random()*360-180;
  pedTmp.makeRotationY(Math.random()*Math.PI*2);
  pedTmp.setPosition(x,0.8,z);
  pedMesh.setMatrixAt(i,pedTmp);
  pedMesh.setColorAt(i,new THREE.Color(pedColors[Math.floor(Math.random()*pedColors.length)]));
}
pedMesh.count=120; pedMesh.instanceMatrix.needsUpdate=true; pedMesh.instanceColor.needsUpdate=true;
scene.add(pedMesh);

// steam vents
const steamGeo=new THREE.BufferGeometry();
const steamPos=new Float32Array(200*3);
for(let i=0;i<200;i++){steamPos[i*3]= (Math.random()-0.5)*2; steamPos[i*3+1]=Math.random()*4; steamPos[i*3+2]=(Math.random()-0.5)*2;}
steamGeo.setAttribute('position',new THREE.BufferAttribute(steamPos,3));
const steamMat=new THREE.PointsMaterial({color:0xffffff,size:0.35,transparent:true,opacity:0.18,depthWrite:false});
const steam=new THREE.Points(steamGeo,steamMat);
steam.position.set(0,14,0); // placeholder, will scatter via multiple
scene.add(steam);

const clock = new THREE.Clock();
const target = new THREE.Vector3(0,18,0);
let camRadius=125, camTheta=0.4, camPhi=Math.PI/2-0.35;
let autoRotate=false;
let isDown=false, dragButton=0, lastX=0, lastY=0;
const dom=renderer.domElement;
dom.style.cursor='grab';
dom.addEventListener('mousedown',e=>{isDown=true;dragButton=e.button;lastX=e.clientX;lastY=e.clientY;dom.style.cursor='grabbing';});
window.addEventListener('mouseup',()=>{isDown=false;dom.style.cursor='grab';});
window.addEventListener('mousemove',e=>{
  if(isDown){
    const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    if(dragButton===0){ camTheta -= dx*0.006; camPhi -= dy*0.006; camPhi=Math.max(0.08,Math.min(Math.PI-0.08,camPhi)); }
    else { target.x -= dx*0.05; target.y += dy*0.05; }
  }
});
dom.addEventListener('contextmenu',e=>e.preventDefault());
dom.addEventListener('wheel',e=>{ e.preventDefault(); camRadius*=1+e.deltaY*0.0012; camRadius=Math.max(18,Math.min(320,camRadius)); },{passive:false});
let touch0=null;
dom.addEventListener('touchstart',e=>{ if(e.touches.length===1) touch0={x:e.touches[0].clientX,y:e.touches[0].clientY}; },{passive:true});
dom.addEventListener('touchmove',e=>{ if(e.touches.length===1 && touch0){ const dx=e.touches[0].clientX-touch0.x, dy=e.touches[0].clientY-touch0.y; touch0={x:e.touches[0].clientX,y:e.touches[0].clientY}; camTheta -= dx*0.008; camPhi -= dy*0.008; camPhi=Math.max(0.08,Math.min(Math.PI-0.08,camPhi)); } },{passive:true});
addEventListener('keydown',e=>{
  if(e.code==='Space'){ autoRotate=!autoRotate; }
  if(e.key==='1'){ camTheta=0.4; camPhi=Math.PI/2-0.35; camRadius=125; target.set(0,18,0); }
  if(e.key==='2'){ camTheta=0; camPhi=0.6; camRadius=55; target.set(0,12,0); }
  if(e.key==='3'){ camTheta=0; camPhi=0.25; camRadius=200; target.set(0,0,0); }
  if(e.key==='r'||e.key==='R'){ camTheta=0.4; camPhi=Math.PI/2-0.35; camRadius=125; target.set(0,18,0); autoRotate=false; }
});
window.setCamPreset=(name)=>{
  if(name==='street'){ camTheta=0; camPhi=0.6; camRadius=55; target.set(0,12,0); }
  else if(name==='bird'){ camTheta=0.8; camPhi=0.8; camRadius=140; target.set(0,18,0); }
  else if(name==='aerial'){ camTheta=0; camPhi=0.25; camRadius=240; target.set(0,0,0); autoRotate=false; }
  else if(name==='auto'){ autoRotate=!autoRotate; }
  else if(name==='reset'){ camTheta=0.4; camPhi=Math.PI/2-0.35; camRadius=125; target.set(0,18,0); autoRotate=false; }
};
// --- Street detail ---
const yellowMat=new THREE.MeshBasicMaterial({color:0xffcc33});
const whiteMat=new THREE.MeshBasicMaterial({color:0xffffff});
const curbStoneMat=new THREE.MeshStandardMaterial({color:0x6b6f78,roughness:0.9});
// lane markings (horizontal + vertical roads)
for(let i=-8;i<=8;i++){
  const z=i*22;
  // center yellow double line
  const yc=new THREE.Mesh(new THREE.BoxGeometry(400,0.06,0.18),yellowMat); yc.position.set(0,0.06,z); scene.add(yc);
  const yc2=new THREE.Mesh(new THREE.BoxGeometry(400,0.06,0.18),yellowMat); yc2.position.set(0,0.06,z+0.45); scene.add(yc2);
  // white edge lines
  for(const off of [-9.6, 9.4]){
    const e=new THREE.Mesh(new THREE.BoxGeometry(400,0.06,0.14),whiteMat); e.position.set(0,0.06,z+off); scene.add(e);
  }
  const x=i*22;
  const xc=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.06,400),yellowMat); xc.position.set(x,0.06,0); scene.add(xc);
  const xc2=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.06,400),yellowMat); xc2.position.set(x+0.45,0.06,0); scene.add(xc2);
  for(const off of [-9.6, 9.4]){
    const e=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.06,400),whiteMat); e.position.set(x+off,0.06,0); scene.add(e);
  }
}
// zebra crosswalks + curbs at intersections
for(let gx=-7;gx<=7;gx+=2){
  for(let gz=-7;gz<=7;gz+=2){
    const x=gx*22, z=gz*22;
    // curbs (small raised boxes)
    for(let k=0;k<8;k++){
      const curb=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.35,0.4),curbStoneMat);
      curb.position.set(x-6+k*1.7,0.17,z+11.2); scene.add(curb);
      const curb2=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.35,0.4),curbStoneMat);
      curb2.position.set(x-6+k*1.7,0.17,z-11.2); scene.add(curb2);
      const curb3=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.35,1.2),curbStoneMat);
      curb3.position.set(x+11.2,0.17,z-6+k*1.7); scene.add(curb3);
      const curb4=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.35,1.2),curbStoneMat);
      curb4.position.set(x-11.2,0.17,z-6+k*1.7); scene.add(curb4);
    }
    // white zebra bars
    for(let k=0;k<6;k++){
      const bar=new THREE.Mesh(new THREE.BoxGeometry(10,0.07,0.7),whiteMat);
      bar.position.set(x,0.065,z-4+k*1.2+0.6); scene.add(bar);
      const bar2=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.07,10),whiteMat);
      bar2.position.set(x-4+k*1.2+0.6,0.065,z); scene.add(bar2);
    }
  }
}
// traffic lights at every other intersection
const poleMatTS=new THREE.MeshStandardMaterial({color:0x3a3a3a,metalness:0.6,roughness:0.4});
const housingMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:0.6});
const redMat=new THREE.MeshStandardMaterial({color:0xff3333,emissive:0xff2222,emissiveIntensity:1.4});
const yelMat=new THREE.MeshStandardMaterial({color:0xffaa00,emissive:0xffaa00,emissiveIntensity:0.4});
const grnMat=new THREE.MeshStandardMaterial({color:0x33ff66,emissive:0x33ff66,emissiveIntensity:0.4});
for(let gx=-7;gx<=7;gx+=3){
  for(let gz=-7;gz<=7;gz+=3){
    const x=gx*22+11.5, z=gz*22+11.5;
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,9,6),poleMatTS); pole.position.set(x,4.5,z); scene.add(pole);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.2,0.2),poleMatTS); arm.position.set(x-1.4,8.8,z); scene.add(arm);
    const housing=new THREE.Mesh(new THREE.BoxGeometry(0.9,2.4,0.9),housingMat); housing.position.set(x-2.6,8.8,z); scene.add(housing);
    const rl=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,8),redMat); rl.position.set(x-2.6,9.7,z); scene.add(rl);
    const yl=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,8),yelMat); yl.position.set(x-2.6,8.8,z); scene.add(yl);
    const gl=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,8),grnMat); gl.position.set(x-2.6,7.9,z); scene.add(gl);
  }
}
// street furniture
const hydrantMat=new THREE.MeshStandardMaterial({color:0xcc2222,roughness:0.6});
const signPoleMat=new THREE.MeshStandardMaterial({color:0x888888,metalness:0.7,roughness:0.3});
const signBoardMat=new THREE.MeshStandardMaterial({color:0x0a2a55,roughness:0.4,metalness:0.2,emissive:0x0a2a55,emissiveIntensity:0.3});
const trashMat=new THREE.MeshStandardMaterial({color:0x2a2a2a,roughness:0.9});
function rnd(arr){return arr[Math.floor(Math.random()*arr.length)];}
for(let n=0;n<70;n++){
  const x=Math.random()*360-180;
  const z=Math.random()*360-180;
  // hydrant
  if(n%2===0){
    const h=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.45,0.9,10),hydrantMat); h.position.set(x,0.45,z); scene.add(h);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.3,10),hydrantMat); cap.position.set(x,1.05,z); scene.add(cap);
  }
  // street sign
  if(n%3===0){
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,5,6),signPoleMat); pole.position.set(x+12,2.5,z); scene.add(pole);
    const board=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.0,0.15),signBoardMat); board.position.set(x+12,5.0,z); scene.add(board);
  }
  // trash can
  if(n%4===0){
    const can=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.45,1.1,12),trashMat); can.position.set(x,z? x*0+4:0, z? z:0); can.position.set(x,0.55,z+4); scene.add(can);
  }
}
// parked cars along curbs
const parkedMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.45,metalness:0.35});
const parkedColors=[0xee3333,0x111111,0xf5f5f5,0xffb000,0x2a4fa3,0x666666,0x33cc66,0x8899aa,0xcc66cc];
const parkedGeo=new THREE.BoxGeometry(2,0.9,4.2);
const parkedMesh=new THREE.InstancedMesh(parkedGeo,parkedMat,80);
let pp=0;
for(let n=0;n<80;n++){
  const horizontal = Math.random()<0.5;
  let x,z,rot;
  if(horizontal){
    const roadZ=(Math.floor(Math.random()*17)-8)*22;
    const side=Math.random()<0.5?-1:1;
    x=Math.random()*320-160;
    z=roadZ+side*10.2;
    rot=0;
  } else {
    const roadX=(Math.floor(Math.random()*17)-8)*22;
    const side=Math.random()<0.5?-1:1;
    z=Math.random()*320-160;
    x=roadX+side*10.2;
    rot=Math.PI/2;
  }
  const m=new THREE.Matrix4();
  m.makeRotationY(rot);
  m.setPosition(x,0.45,z);
  parkedMesh.setMatrixAt(pp,m);
  parkedMesh.setColorAt(pp,new THREE.Color(parkedColors[Math.floor(Math.random()*parkedColors.length)]));
  pp++;
}
parkedMesh.count=80;
parkedMesh.instanceMatrix.needsUpdate=true;
scene.add(parkedMesh);

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  updateCars(dt);
  const sp=steam.geometry.attributes.position.array;
  for(let i=0;i<200;i++){sp[i*3+1]+=dt*0.6; if(sp[i*3+1]>6){sp[i*3+1]=0; sp[i*3]=(Math.random()-0.5)*2; sp[i*3+2]=(Math.random()-0.5)*2;}}
  steam.geometry.attributes.position.needsUpdate=true;
  const rp=rain.geometry.attributes.position.array;
  for(let i=0;i<1200;i++){rp[i*3+1]-=dt*26;if(rp[i*3+1]<0){rp[i*3+1]=100;rp[i*3]=(Math.random()-0.5)*260;rp[i*3+2]=(Math.random()-0.5)*260;}}
  rain.geometry.attributes.position.needsUpdate=true;
  windowMats.forEach(m=>{ m.emissiveIntensity=1.3+Math.sin(t*m.userData.speed+m.userData.phase)*0.55; });
  const tlPhase=Math.floor(t*0.35)%3;
  redMat.emissiveIntensity = tlPhase===0?2.2:0.25;
  yelMat.emissiveIntensity = tlPhase===1?2.2:0.25;
  grnMat.emissiveIntensity = tlPhase===2?2.2:0.25;
  if(autoRotate) camTheta += dt*0.25;
  scene.fog.density = Math.max(0.0035, 0.010 * 110 / Math.max(camRadius,90));
  const pos=new THREE.Vector3().setFromSphericalCoords(camRadius,camPhi,camTheta).add(target);
  camera.position.copy(pos);
  camera.lookAt(target);
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
